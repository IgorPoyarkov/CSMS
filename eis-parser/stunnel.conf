; ============================================================================
; Локальный ГОСТ-TLS туннель к ЕИС 44-ФЗ (сервис getDocsIP).
;
; ВАЖНО: это шаблон. PIN от Рутокена НЕ записывайте в этот файл — он попадёт
; в git. Скрипт scripts/start-stunnel.ps1 запрашивает PIN и пишет рабочий
; конфиг в %TEMP%, вне репозитория.
;
; Запуск:
;   powershell -ExecutionPolicy Bypass -File scripts\start-stunnel.ps1
;
; Либо вручную (только локально!):
;   stunnel-msspi.exe stunnel.local.conf    ; stunnel.local.conf в .gitignore
;
; Требования на машине:
;   1. stunnel-msspi.exe сборки CryptoPro 5.78-msspi-0.84 (или новее с
;      поддержкой Windows). Обычный OpenSSL-стunnel ГОСТ не понимает.
;      Распаковать, например, в C:\Tools\stunnel-cpro.
;   2. КриптоПро CSP + сертификат ИП с приватным ключом на Рутокене.
;   3. Доступ к int44.zakupki.gov.ru:443 по TCP. Официальная WSDL getDocsIP
;      указывает именно этот хост. Если он сбрасывает TLS-handshake, проверенный
;      запасной контур — int.zakupki.gov.ru:443 (отдаёт тот же WSDL fz44/get-docs-ip):
;      powershell -ExecutionPolicy Bypass -File scripts\start-stunnel.ps1 -Connect int.zakupki.gov.ru:443
;
; Проверить после запуска:
;   dotnet run --project src/Eis44Parser.Worker -- --check
; ============================================================================

[eis-44]
client = yes
accept = 127.0.0.1:8080
connect = int44.zakupki.gov.ru:443
sni = int44.zakupki.gov.ru
sslVersion = TLSv1.2

; Отпечаток (SHA-1) клиентского сертификата из хранилища КриптоПро.
; Это не секрет — можно держать в репозитории.
cert = 08A26ABA98738FEE6BB29A103D1909A251C5D20F

; PIN задаётся только в локальном конфиге вне репозитория.
;pin = ВАШ_PIN_ОТ_РУТОКЕНА

; В stunnel-msspi cipher-лист задаётся ШЕСТНАДЦАТЕРНЫМИ кодами suites
; (разделитель — пробел или двоеточие), а не именами OpenSSL.
; 0xff85 = GOST2012-GOST8912-GOST8912 — тот самый suite, который ЕИС
; выбирает в Wireshark-дампе из issue gost-engine/engine#464.
ciphers = ff85

; Для отладки: debug = 7 и output = <путь к логу вне репозитория>.
;verify = 0
