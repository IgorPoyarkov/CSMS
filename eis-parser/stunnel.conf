; ============================================================================
; Локальный ГОСТ-TLS туннель к ЕИС 44-ФЗ (сервис getDocsIP).
;
; Запуск из папки eis-parser:
;   stunnel.exe stunnel.conf
;
; Требования на машине:
;   1. Сборка stunnel с поддержкой ГОСТ-шифров (GOST2012-GOST8912-GOST8912).
;      Обычный stunnel из standard-сборок OpenSSL такой шифр не понимает —
;      нужна сборка с ГОСТ-движком (например, от КриптоПро или GOST-ветка).
;   2. Установленный и настроенный КриптоПро CSP, сертификат и приватный ключ
;      в хранилище пользователя/машины.
;   3. Доступ к int44.zakupki.gov.ru:443 (файрвол/прокси).
;
; Проверить после запуска:
;   dotnet run --project src/Eis44Parser.Worker -- --check
; ============================================================================

; Общие настройки (в Windows стunnel читает эти строки перед секциями)
;debug = 7
;output = stunnel.log

[eis-44]
client = yes
accept = 127.0.0.1:8080
connect = int44.zakupki.gov.ru:443

; ГОСТ TLS 1.2. Если ваша сборка stunnel требует явного указания шифров —
; раскомментируйте блок ниже. Набор шифров сверьте с документацией ЕИС/вашей
; сборки: для ГОСТ 2012 это GOST2012-GOST8912-GOST8912.
;sslVersion = TLSv1.2
;ciphers = GOST2012-GOST8912-GOST8912:GOST2001-GOST89-GOST89
;options = NO_TLSv1

; Для отладки handshake можно временно отключить проверку сертификата.
;verify = 0
