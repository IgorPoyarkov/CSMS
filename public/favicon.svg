<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="КСЗ — контрактная служба заказчика">
    <!-- Фавикон КСЗ: основной неоновый знак без свечения — в 16–32 px
         размытие только «съедает» контур, поэтому здесь чистые линии. -->
    <defs>
        <linearGradient id="favicon-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#16233A" />
            <stop offset="1" stop-color="#070B14" />
        </linearGradient>
        <linearGradient id="favicon-edge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22D3EE" />
            <stop offset="0.55" stop-color="#7C8CFF" />
            <stop offset="1" stop-color="#F472B6" />
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#favicon-tile)" />
    <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#favicon-edge)" stroke-width="2" />

    <!-- Монограмма «К»: стойка, верхний луч с полкой, нижний луч с ножкой -->
    <rect x="16.5" y="16" width="7" height="32" rx="3.5" fill="#E8F0FF" />
    <path d="M22.5 31.5 L37 17" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" />
    <path d="M37 17 H43" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" />
    <path d="M22.5 32.5 L37 47" stroke="#E8F0FF" stroke-width="7" stroke-linecap="round" />
    <path d="M37 47 V52" stroke="#7C8CFF" stroke-width="7" stroke-linecap="round" />
</svg>
